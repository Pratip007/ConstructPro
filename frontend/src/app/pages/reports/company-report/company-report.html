<div class="page-container">
  <div class="page-header">
    <h1><i class="ri-building-line"></i> Company Report</h1>
    <div class="header-actions">
      <button class="btn-secondary" (click)="exportExcel()" [disabled]="!rows().length">
        <i class="ri-file-excel-2-line"></i> Export Excel
      </button>
      <button class="btn-secondary" (click)="printReport()" [disabled]="!rows().length">
        <i class="ri-printer-line"></i> Print
      </button>
    </div>
  </div>

  @if (rows().length) {
    <app-summary-cards [cards]="summaryCards" />
  }

  <div class="card-container">
    <div class="form-grid">
      <div class="form-group">
        <label>Search</label>
        <input type="text" [(ngModel)]="search" placeholder="Search by name..." (keyup.enter)="load()" />
      </div>
      <div class="form-group" style="align-self: end;">
        <button class="btn-primary" (click)="load()" [disabled]="loading()">
          @if (loading()) { Loading... } @else { <i class="ri-search-line"></i> Search }
        </button>
      </div>
    </div>
    @if (error()) {
      <p class="error-text" style="color:red;margin-top:8px;">{{ error() }}</p>
    }
  </div>

  <div id="company-report-table">
    <app-data-table
      [columns]="columns"
      [data]="rows()"
      [loading]="loading()"
      fileName="company-report"
      emptyMessage="No companies found."
    />
  </div>
</div>
