<div class="page-container">
  <div class="page-header">
    <h1><i class="ri-user-settings-line"></i> Contractor Report</h1>
    <div class="header-actions">
      <button class="btn-secondary" (click)="exportExcel()" [disabled]="!rows().length">
        <i class="ri-file-excel-2-line"></i> Export Excel
      </button>
      <button class="btn-secondary" (click)="printReport()" [disabled]="!rows().length">
        <i class="ri-printer-line"></i> Print
      </button>
      <button class="btn-primary" (click)="load()" [disabled]="loading()">
        <i class="ri-refresh-line"></i> Refresh
      </button>
    </div>
  </div>

  @if (rows().length) {
    <app-summary-cards [cards]="summaryCards" />
  }

  @if (error()) {
    <p class="error-text" style="color:red;margin:8px 0;">{{ error() }}</p>
  }

  <div id="contractor-report-table">
    <app-data-table
      [columns]="columns"
      [data]="rows()"
      [loading]="loading()"
      fileName="contractor-report"
      emptyMessage="No contractors found."
    />
  </div>
</div>
