<div class="page-container">
  <div class="page-header">
    <h1><i class="ri-file-text-line"></i> GST Bill Download</h1>
    <div class="header-actions">
      <button class="btn-export" (click)="exportExcel()" [disabled]="!rows().length">
        <i class="ri-file-excel-2-line"></i> Export Excel
      </button>
      <button class="btn-secondary" (click)="printReport()" [disabled]="!rows().length">
        <i class="ri-printer-line"></i> Print
      </button>
    </div>
  </div>

  @if (rows().length) {
    <app-summary-cards [cards]="summaryCards" />
  }

  <div class="card-container">
    <div class="table-toolbar">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
        <div class="form-group" style="margin-bottom:0;min-width:160px;">
          <label>Company</label>
          <app-searchable-dropdown [items]="companyItems" placeholder="All Companies"
            [ngModel]="companyFilter()" (ngModelChange)="companyFilter.set($event)" name="comp" />
        </div>
        <div class="form-group" style="margin-bottom:0;min-width:160px;">
          <label>Site</label>
          <app-searchable-dropdown [items]="siteItems" placeholder="All Sites"
            [ngModel]="siteFilter()" (ngModelChange)="siteFilter.set($event)" name="site" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label>From</label>
          <input type="date" [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event)" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label>To</label>
          <input type="date" [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event)" />
        </div>
        <button class="btn-primary" (click)="generate()" [disabled]="loading()" style="height:38px;">
          @if (loading()) { Loading... } @else { <i class="ri-search-line"></i> Generate }
        </button>
      </div>
    </div>
    @if (error()) {
      <p style="color:var(--danger);margin-top:8px;">{{ error() }}</p>
    }
  </div>

  <div id="gst-report-table">
    <app-data-table
      [columns]="columns"
      [data]="rows()"
      [loading]="loading()"
      fileName="gst-bill-download"
      emptyMessage="Select filters and generate report."
    />
  </div>
</div>
