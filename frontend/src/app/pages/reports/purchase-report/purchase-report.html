<div class="page-container">
  <div class="page-header">
    <h1><i class="ri-shopping-cart-line"></i> Purchase Report</h1>
    <div class="header-actions">
      <button class="btn-secondary" (click)="exportExcel()" [disabled]="!rows().length">
        <i class="ri-file-excel-2-line"></i> Export Excel
      </button>
      <button class="btn-secondary" (click)="printReport()" [disabled]="!rows().length">
        <i class="ri-printer-line"></i> Print
      </button>
    </div>
  </div>

  @if (rows().length) {
    <app-summary-cards [cards]="summaryCards" />
  }

  <div class="card-container">
    <div class="form-grid">
      <div class="form-group">
        <label>From Date</label>
        <input type="date" [(ngModel)]="dateFrom" />
      </div>
      <div class="form-group">
        <label>To Date</label>
        <input type="date" [(ngModel)]="dateTo" />
      </div>
      <div class="form-group">
        <label>Site</label>
        <select [(ngModel)]="siteId">
          <option value="">All Sites</option>
          @for (site of sites; track site.id) {
            <option [value]="site.id">{{ site.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Retailer</label>
        <select [(ngModel)]="retailerId">
          <option value="">All Retailers</option>
          @for (r of retailers; track r.id) {
            <option [value]="r.id">{{ r.name }}</option>
          }
        </select>
      </div>
    </div>
    <div style="margin-top: 15px;">
      <button class="btn-primary" (click)="generate()" [disabled]="loading()">
        @if (loading()) { Loading... } @else { <i class="ri-bar-chart-line"></i> Generate Report }
      </button>
    </div>
    @if (error()) {
      <p class="error-text" style="color:red;margin-top:8px;">{{ error() }}</p>
    }
  </div>

  <div id="purchase-report-table">
    <app-data-table
      [columns]="columns"
      [data]="rows()"
      [loading]="loading()"
      fileName="purchase-report"
      emptyMessage="Select filters and generate report."
    />
  </div>
</div>
