<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATR Construction - Change Password</title>

    <!-- Sync theme with Master Dashboard (Admin, Office & Supervisor Portals) -->
    <script>
        function applyDashboardTheme() {
            const savedTheme = localStorage.getItem('atr_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        applyDashboardTheme();
        window.addEventListener('storage', function(e) {
            if (e.key === 'atr_theme' || !e.key) {
                applyDashboardTheme();
            }
        });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-input: #2b2b2b;
            --bg-input-focus: #333333;
            --text-main: #ffffff;
            --text-label: #cccccc;
            --text-muted: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            --accent-color: #ffc107;
            --accent-hover: #e0a800;
        }

        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-input: #f4f6f9;
            --bg-input-focus: #ffffff;
            --text-main: #1a1a1a;
            --text-label: #444444;
            --text-muted: #666666;
            --border-color: rgba(0, 0, 0, 0.15);
            --card-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            --accent-color: #ffc107;
            --accent-hover: #e0a800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .form-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            box-shadow: var(--card-shadow);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-header h2 {
            font-size: 22px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 12.5px;
            color: var(--text-muted);
        }

        /* 3-PORTAL ROLE SWITCHER TABS */
        .portal-role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
            background: var(--bg-input);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .role-tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 9px 6px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
        }

        .role-tab-btn:hover:not(:disabled) {
            color: var(--text-main);
        }

        .role-tab-btn.active {
            background: var(--accent-color);
            color: #121212;
            box-shadow: 0 3px 10px rgba(255, 193, 7, 0.3);
        }

        .role-tab-btn:disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-label);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pass-hint-badge {
            font-size: 10.5px;
            color: var(--accent-color);
            text-transform: none;
            font-weight: 600;
            background: rgba(255, 193, 7, 0.12);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .pass-hint-badge.admin-unlocked {
            color: #28a745;
            background: rgba(40, 167, 69, 0.14);
            border-color: rgba(40, 167, 69, 0.35);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 42px 12px 15px;
            background-color: var(--bg-input) !important;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main) !important;
            font-size: 13.5px;
            font-weight: 500;
            transition: all 0.3s;
            color-scheme: dark;
        }

        [data-theme="light"] .form-group input,
        [data-theme="light"] .form-group select {
            color-scheme: light;
        }

        .form-group select {
            padding-right: 15px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Locked Dropdown Styling for Office & Supervisor Users */
        .form-group select:disabled {
            cursor: not-allowed;
            opacity: 0.92;
            border-color: rgba(255, 193, 7, 0.45);
            background-color: rgba(255, 193, 7, 0.07) !important;
            color: var(--accent-color) !important;
        }

        .form-group select option {
            background-color: var(--bg-card);
            color: var(--text-main);
            font-weight: 600;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--bg-input-focus) !important;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.2);
        }

        .toggle-pass-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .toggle-pass-btn:hover {
            color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .status-msg-box {
            display: none;
            margin-top: 14px;
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
        }

        .status-msg-box.success {
            display: block;
            background: rgba(40, 167, 69, 0.15);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.4);
        }

        .status-msg-box.error {
            display: block;
            background: rgba(220, 53, 69, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.4);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>🔑 Change Password</h2>
            <p id="portalSubtitle">Update your secure account credentials</p>
        </div>

        <!-- 3-PORTAL ROLE SELECTOR (Unlocked ONLY for Admin; Locked for Office & Supervisor) -->
        <div class="portal-role-tabs">
            <button type="button" class="role-tab-btn active" id="tabBtnAdmin" onclick="handleRoleTabClick('admin')">
                🛡️ Admin
            </button>
            <button type="button" class="role-tab-btn" id="tabBtnOffice" onclick="handleRoleTabClick('office')">
                🏢 Office
            </button>
            <button type="button" class="role-tab-btn" id="tabBtnSupervisor" onclick="handleRoleTabClick('supervisor')">
                👷 Supervisor
            </button>
        </div>

        <!-- data-office-hooked="true" prevents OfficeDashboard generic form interceptor from blocking password change -->
        <form id="changePasswordForm" data-office-hooked="true" onsubmit="handlePasswordChange(event)">
            
            <!-- DYNAMIC USER ACCOUNT SELECTOR (Unlocked for Admin; Defaulted & Locked for Office/Supervisor) -->
            <div class="form-group">
                <label for="userAccountSelect">
                    <span id="userSelectLabel">User Account</span>
                    <span id="activeRoleBadge" class="pass-hint-badge">Admin Portal</span>
                </label>
                <select id="userAccountSelect" onchange="onUserAccountChange()"></select>
            </div>

            <div class="form-group">
                <label for="currentPass">
                    <span>Current Password</span>
                    <span id="currentPassHint" class="pass-hint-badge">Default: admin123</span>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="currentPass" placeholder="Enter current password" required>
                    <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('currentPass', this)" title="Show/Hide Password">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="newPass">
                    <span>New Password</span>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="newPass" placeholder="Enter new password" required>
                    <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('newPass', this)" title="Show/Hide Password">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPass">
                    <span>Confirm New Password</span>
                </label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPass" placeholder="Re-enter new password" required>
                    <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('confirmPass', this)" title="Show/Hide Password">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtnText">Update Admin Password</button>
            <div id="statusMessageBox" class="status-msg-box"></div>
        </form>

        <a href="dashboard_home.html" id="btnBackDashboard" class="back-link" onclick="handleBackToDashboard(event)">← Back to Dashboard</a>
    </div>

    <script>
        // =========================================================================================
        // 1. PORTAL SECURITY STATE
        // loggedPortalContext = Which portal opened this page ('admin', 'office', or 'supervisor')
        // ONLY 'admin' can switch tabs and select any Office/Supervisor user.
        // 'office' and 'supervisor' are strictly locked to their own active user account.
        // =========================================================================================
        let loggedPortalContext = "admin";   // 'admin', 'office', or 'supervisor'
        let currentPortalMode = "admin";     // Currently viewed tab ('admin', 'office', or 'supervisor')
        let lockedActiveUserId = "";         // Locked user ID when in Office or Supervisor portal

        const DEFAULT_OFFICE_USERS = [
            { userId: "OFF-101", name: "Anuradha Dipali", designation: "Accounts & Billing Executive" },
            { userId: "OFF-102", name: "Vikas Pandey", designation: "HR & Employee Coordinator" },
            { userId: "OFF-103", name: "Murshed Akhter", designation: "Purchase & Stock Executive" }
        ];

        const DEFAULT_SUPERVISOR_USERS = [
            { supId: "SUP-003", name: "Subrata Roy", site: "Salt Lake Sector V" },
            { supId: "SUP-001", name: "Bikash Sinha", site: "Dum Dum Project" },
            { supId: "SUP-002", name: "Amitava Ghosh", site: "Barasat Highway" }
        ];

        function getOfficeUsersList() {
            const keys = ['atr_office_users', 'atr_users', 'new_user_entry', 'NewUserEntry', 'users', 'office_users'];
            const list = [...DEFAULT_OFFICE_USERS];

            keys.forEach(k => {
                try {
                    const parsed = JSON.parse(localStorage.getItem(k));
                    if (Array.isArray(parsed)) {
                        parsed.forEach(u => {
                            const uid = String(u.userId || u.id || u.empId || u.username || "").trim();
                            const uname = String(u.name || u.userName || u.fullName || "").trim();
                            if (uid && !list.some(ex => ex.userId.toUpperCase() === uid.toUpperCase())) {
                                list.push({
                                    userId: uid,
                                    name: uname || uid,
                                    designation: u.designation || u.role || "Office Staff"
                                });
                            }
                        });
                    }
                } catch (e) {}
            });
            return list;
        }

        function getSupervisorUsersList() {
            const keys = ['atr_supervisors_db', 'atr_supervisors', 'supervisors', 'AddSupervisor'];
            const list = [...DEFAULT_SUPERVISOR_USERS];

            keys.forEach(k => {
                try {
                    const parsed = JSON.parse(localStorage.getItem(k));
                    if (Array.isArray(parsed)) {
                        parsed.forEach(s => {
                            const sid = String(s.supId || s.id || s.userId || "").trim();
                            const sname = String(s.name || s.supName || s.supervisorName || "").trim();
                            const ssite = String(s.site || s.siteName || s.assignedSite || "Assigned Site").trim();
                            if (sid && !list.some(ex => ex.supId.toUpperCase() === sid.toUpperCase())) {
                                list.push({
                                    supId: sid,
                                    name: sname || sid,
                                    site: ssite
                                });
                            }
                        });
                    }
                } catch (e) {}
            });
            return list;
        }

        // =========================================================================================
        // 2. GET & SAVE PASSWORDS PER SPECIFIC USER ID IN EACH PORTAL
        // =========================================================================================
        function getSavedPasswordForAccount(roleMode, accountId) {
            const cleanId = String(accountId || '').trim().toUpperCase();

            if (roleMode === 'admin') {
                return localStorage.getItem('atr_admin_password') || "admin123";
            }

            if (roleMode === 'office') {
                const directPass = localStorage.getItem('atr_office_pass_' + cleanId);
                if (directPass) return directPass;

                const keys = ['atr_office_users', 'atr_users', 'new_user_entry', 'NewUserEntry'];
                for (let k of keys) {
                    try {
                        const arr = JSON.parse(localStorage.getItem(k));
                        if (Array.isArray(arr)) {
                            const found = arr.find(u => String(u.userId || u.id || '').toUpperCase() === cleanId);
                            if (found && (found.password || found.pass)) {
                                return String(found.password || found.pass);
                            }
                        }
                    } catch (e) {}
                }
                return "office123";
            }

            if (roleMode === 'supervisor') {
                const directPass = localStorage.getItem('atr_supervisor_pass_' + cleanId);
                if (directPass) return directPass;

                const keys = ['atr_supervisors_db', 'atr_supervisors', 'supervisors'];
                for (let k of keys) {
                    try {
                        const arr = JSON.parse(localStorage.getItem(k));
                        if (Array.isArray(arr)) {
                            const found = arr.find(s => String(s.supId || s.id || '').toUpperCase() === cleanId);
                            if (found && (found.password || found.pass)) {
                                return String(found.password || found.pass);
                            }
                        }
                    } catch (e) {}
                }
                return localStorage.getItem('atr_supervisor_password') || "sup123";
            }

            return "admin123";
        }

        function saveNewPasswordForAccount(roleMode, accountId, newPass) {
            const cleanId = String(accountId || '').trim().toUpperCase();

            if (roleMode === 'admin') {
                localStorage.setItem('atr_admin_password', newPass);
                localStorage.setItem('atr_pass_ADMIN', newPass);
                return;
            }

            if (roleMode === 'office') {
                localStorage.setItem('atr_office_pass_' + cleanId, newPass);
                const keys = ['atr_office_users', 'atr_users', 'new_user_entry', 'NewUserEntry'];
                keys.forEach(k => {
                    try {
                        const arr = JSON.parse(localStorage.getItem(k));
                        if (Array.isArray(arr)) {
                            let updated = false;
                            arr.forEach(u => {
                                if (String(u.userId || u.id || '').toUpperCase() === cleanId) {
                                    u.password = newPass;
                                    updated = true;
                                }
                            });
                            if (updated) localStorage.setItem(k, JSON.stringify(arr));
                        }
                    } catch (e) {}
                });
                return;
            }

            if (roleMode === 'supervisor') {
                localStorage.setItem('atr_supervisor_pass_' + cleanId, newPass);
                localStorage.setItem('atr_supervisor_password', newPass);
                const keys = ['atr_supervisors_db', 'atr_supervisors', 'supervisors'];
                keys.forEach(k => {
                    try {
                        const arr = JSON.parse(localStorage.getItem(k));
                        if (Array.isArray(arr)) {
                            let updated = false;
                            arr.forEach(s => {
                                if (String(s.supId || s.id || '').toUpperCase() === cleanId) {
                                    s.password = newPass;
                                    updated = true;
                                }
                            });
                            if (updated) localStorage.setItem(k, JSON.stringify(arr));
                        }
                    } catch (e) {}
                });
            }
        }

        // =========================================================================================
        // 3. DETECT PORTAL CONTEXT & ENFORCE ROLE-BASED LOCKING
        // =========================================================================================
        function detectInitialPortalAndUser() {
            const urlParams = new URLSearchParams(window.location.search);
            const viewParam = (urlParams.get('view') || urlParams.get('role') || '').toLowerCase();
            const ref = (document.referrer || '').toLowerCase();

            let parentPath = "";
            let parentTitle = "";
            let parentOfficeUserId = "";
            let parentSupervisorId = "";
            let parentSupervisorSite = "";

            try {
                if (window.parent && window.parent !== window) {
                    parentPath = (window.parent.location.pathname || '').toLowerCase();
                    parentTitle = (window.parent.document.title || '').toLowerCase();

                    // Inspect OfficeDashboard.html active user
                    const officeRoleEl = window.parent.document.getElementById('sidebarUserRole');
                    if (officeRoleEl && officeRoleEl.innerText.includes('ID:')) {
                        const match = officeRoleEl.innerText.match(/ID:\s*([^\s|]+)/i);
                        if (match && match[1]) parentOfficeUserId = match[1].trim();
                    }

                    // Inspect SupervisorDashboard.html active supervisor
                    const supRoleEl = window.parent.document.getElementById('supIdDisplay') || window.parent.document.querySelector('[data-sup-id]');
                    if (supRoleEl) {
                        parentSupervisorId = supRoleEl.getAttribute('data-sup-id') || supRoleEl.innerText.trim();
                    }
                    const supSiteEl = window.parent.document.getElementById('supSiteBadge') || window.parent.document.getElementById('headerSiteName');
                    if (supSiteEl) {
                        parentSupervisorSite = supSiteEl.innerText.replace(/.*:/, '').trim();
                    }
                }
            } catch (e) {}

            if (
                viewParam === 'office' ||
                parentPath.includes('officedashboard') ||
                parentTitle.includes('office staff') ||
                ref.includes('officedashboard') ||
                ref.includes('/office/') ||
                parentOfficeUserId
            ) {
                loggedPortalContext = 'office';
            } else if (
                viewParam === 'supervisor' ||
                parentPath.includes('supervisordashboard') ||
                parentTitle.includes('supervisor') ||
                ref.includes('supervisordashboard') ||
                ref.includes('/supervisor/') ||
                parentSupervisorId
            ) {
                loggedPortalContext = 'supervisor';
            } else if (
                viewParam === 'admin' ||
                parentPath.includes('dashboard.html') ||
                parentTitle.includes('master dashboard') ||
                ref.includes('dashboard.html')
            ) {
                loggedPortalContext = 'admin';
            } else {
                // Fallback for strict file:// iframe where parent & referrer are hidden
                if (sessionStorage.getItem('atr_logged_office_id')) {
                    loggedPortalContext = 'office';
                } else if (sessionStorage.getItem('atr_supervisor_site') || sessionStorage.getItem('atr_logged_supervisor_id')) {
                    loggedPortalContext = 'supervisor';
                } else {
                    loggedPortalContext = 'admin';
                }
            }

            // Resolve active locked user ID for Office or Supervisor portals
            if (loggedPortalContext === 'office') {
                lockedActiveUserId = (
                    parentOfficeUserId ||
                    urlParams.get('userId') ||
                    sessionStorage.getItem('atr_logged_office_id') ||
                    localStorage.getItem('atr_logged_office_id') ||
                    "OFF-101"
                ).trim().toUpperCase();
            } else if (loggedPortalContext === 'supervisor') {
                const supUsers = getSupervisorUsersList();
                const targetSite = (
                    parentSupervisorSite ||
                    urlParams.get('site') ||
                    sessionStorage.getItem('atr_supervisor_site') ||
                    localStorage.getItem('atr_supervisor_site') ||
                    "Salt Lake Sector V"
                ).toLowerCase();

                const explicitSupId = (
                    parentSupervisorId ||
                    urlParams.get('supId') ||
                    sessionStorage.getItem('atr_logged_supervisor_id') ||
                    ""
                ).trim().toUpperCase();

                const matchedSup = supUsers.find(s =>
                    (explicitSupId && s.supId.toUpperCase() === explicitSupId) ||
                    (!explicitSupId && s.site.toLowerCase() === targetSite)
                ) || supUsers[0];

                lockedActiveUserId = matchedSup.supId.toUpperCase();
            } else {
                lockedActiveUserId = "";
            }

            applyPortalLockUI();
            switchPortalRole(loggedPortalContext, lockedActiveUserId);
        }

        // Apply Lock/Unlock state to the 3 Role Tabs based on loggedPortalContext
        function applyPortalLockUI() {
            const btnAdmin = document.getElementById('tabBtnAdmin');
            const btnOffice = document.getElementById('tabBtnOffice');
            const btnSup = document.getElementById('tabBtnSupervisor');

            if (loggedPortalContext === 'admin') {
                // Admin has full access to switch between all 3 tabs
                btnAdmin.disabled = false;
                btnOffice.disabled = false;
                btnSup.disabled = false;
                btnAdmin.innerHTML = `🛡️ Admin`;
                btnOffice.innerHTML = `🏢 Office`;
                btnSup.innerHTML = `👷 Supervisor`;
            } else if (loggedPortalContext === 'office') {
                // Office user is locked strictly to Office tab
                btnAdmin.disabled = true;
                btnOffice.disabled = false;
                btnSup.disabled = true;
                btnAdmin.innerHTML = `🔒 Admin`;
                btnOffice.innerHTML = `🏢 Office`;
                btnSup.innerHTML = `🔒 Supervisor`;
            } else if (loggedPortalContext === 'supervisor') {
                // Supervisor user is locked strictly to Supervisor tab
                btnAdmin.disabled = true;
                btnOffice.disabled = true;
                btnSup.disabled = false;
                btnAdmin.innerHTML = `🔒 Admin`;
                btnOffice.innerHTML = `🔒 Office`;
                btnSup.innerHTML = `👷 Supervisor`;
            }
        }

        function handleRoleTabClick(targetRole) {
            // Block tab switching if the user is NOT in Admin Portal
            if (loggedPortalContext !== 'admin' && targetRole !== loggedPortalContext) {
                alert("🔒 Permission Denied: শুধুমাত্র Admin যেকোনো ইউজারের পাসওয়ার্ড পরিবর্তন করতে পারবেন। আপনি শুধুমাত্র আপনার নিজের পাসওয়ার্ড পরিবর্তন করতে পারবেন।");
                return;
            }
            switchPortalRole(targetRole);
        }

        // =========================================================================================
        // 4. POPULATE USER ACCOUNT DROPDOWN (UNLOCKED FOR ADMIN, LOCKED FOR OFFICE & SUPERVISOR)
        // =========================================================================================
        function switchPortalRole(roleMode, preferredAccountId = "") {
            if (loggedPortalContext !== 'admin') {
                roleMode = loggedPortalContext;
            }
            currentPortalMode = roleMode;

            document.getElementById('tabBtnAdmin').classList.toggle('active', roleMode === 'admin');
            document.getElementById('tabBtnOffice').classList.toggle('active', roleMode === 'office');
            document.getElementById('tabBtnSupervisor').classList.toggle('active', roleMode === 'supervisor');

            const selectEl = document.getElementById('userAccountSelect');
            const badgeEl = document.getElementById('activeRoleBadge');
            const submitBtn = document.getElementById('submitBtnText');
            const subtitleEl = document.getElementById('portalSubtitle');
            const statusBox = document.getElementById('statusMessageBox');
            statusBox.className = 'status-msg-box';
            statusBox.style.display = 'none';

            selectEl.innerHTML = '';

            if (roleMode === 'admin') {
                badgeEl.className = "pass-hint-badge admin-unlocked";
                badgeEl.innerText = "👑 Admin Master Access";
                subtitleEl.innerText = "Admin can update Admin, Office, or Supervisor passwords";
                submitBtn.innerText = "Update Admin Password";

                const opt = document.createElement('option');
                opt.value = "ADMIN";
                opt.innerText = "🛡️ Rahul Sk — Super Admin (ID: ADMIN)";
                selectEl.appendChild(opt);
                selectEl.disabled = true; // Only 1 Super Admin account

            } else if (roleMode === 'office') {
                const officeUsers = getOfficeUsersList();

                if (loggedPortalContext === 'admin') {
                    // Admin Mode: Unlock dropdown so Admin can select ANY Office user
                    badgeEl.className = "pass-hint-badge admin-unlocked";
                    badgeEl.innerText = "👑 Admin Managing Office Users";
                    subtitleEl.innerText = "Select any Office User below to update their password";
                    submitBtn.innerText = "Update Selected Office User Password";

                    officeUsers.forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u.userId;
                        opt.innerText = `🏢 ${u.name} (${u.userId}) — ${u.designation}`;
                        selectEl.appendChild(opt);
                    });
                    selectEl.disabled = false;
                } else {
                    // Office Portal Mode: Lock dropdown strictly to the active Office user ONLY
                    badgeEl.className = "pass-hint-badge";
                    badgeEl.innerText = "🔒 Locked to Active User";
                    subtitleEl.innerText = "Update your personal Office Portal password";
                    submitBtn.innerText = "Update My Password";

                    const activeUser = officeUsers.find(u => u.userId.toUpperCase() === lockedActiveUserId) || officeUsers[0];
                    const opt = document.createElement('option');
                    opt.value = activeUser.userId;
                    opt.selected = true;
                    opt.innerText = `🔒 🏢 ${activeUser.name} (${activeUser.userId}) — ${activeUser.designation}`;
                    selectEl.appendChild(opt);
                    selectEl.disabled = true;
                }

            } else if (roleMode === 'supervisor') {
                const supUsers = getSupervisorUsersList();

                if (loggedPortalContext === 'admin') {
                    // Admin Mode: Unlock dropdown so Admin can select ANY Supervisor
                    badgeEl.className = "pass-hint-badge admin-unlocked";
                    badgeEl.innerText = "👑 Admin Managing Supervisors";
                    subtitleEl.innerText = "Select any Supervisor below to update their password";
                    submitBtn.innerText = "Update Selected Supervisor Password";

                    supUsers.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.supId;
                        opt.innerText = `👷 ${s.name} (${s.supId}) — Site: ${s.site}`;
                        selectEl.appendChild(opt);
                    });
                    selectEl.disabled = false;
                } else {
                    // Supervisor Portal Mode: Lock dropdown strictly to the active Supervisor ONLY
                    badgeEl.className = "pass-hint-badge";
                    badgeEl.innerText = "🔒 Locked to Active Supervisor";
                    subtitleEl.innerText = "Update your personal Supervisor Portal password";
                    submitBtn.innerText = "Update My Password";

                    const activeSup = supUsers.find(s => s.supId.toUpperCase() === lockedActiveUserId) || supUsers[0];
                    const opt = document.createElement('option');
                    opt.value = activeSup.supId;
                    opt.selected = true;
                    opt.innerText = `🔒 👷 ${activeSup.name} (${activeSup.supId}) — Site: ${activeSup.site}`;
                    selectEl.appendChild(opt);
                    selectEl.disabled = true;
                }
            }

            onUserAccountChange();
        }

        function onUserAccountChange() {
            const selectEl = document.getElementById('userAccountSelect');
            const selectedId = selectEl.value;
            const currentSavedPass = getSavedPasswordForAccount(currentPortalMode, selectedId);
            const hintEl = document.getElementById('currentPassHint');

            if (hintEl) {
                hintEl.innerText = `Active Pass: ${currentSavedPass}`;
            }

            document.getElementById('currentPass').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
        }

        function togglePasswordVisibility(inputId, btnEl) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btnEl.innerText = '🙈';
            } else {
                input.type = 'password';
                btnEl.innerText = '👁️';
            }
        }

        // =========================================================================================
        // 5. HANDLE PASSWORD UPDATE (WITH STRICT LOCK ENFORCEMENT)
        // =========================================================================================
        function handlePasswordChange(event) {
            event.preventDefault();

            const selectEl = document.getElementById('userAccountSelect');
            // Enforce locked user ID if in Office or Supervisor portal
            const selectedAccountId = (loggedPortalContext !== 'admin' && lockedActiveUserId)
                ? lockedActiveUserId
                : selectEl.value;
            const selectedAccountText = selectEl.options[selectEl.selectedIndex].text;

            const currentPass = document.getElementById('currentPass').value.trim();
            const newPass = document.getElementById('newPass').value.trim();
            const confirmPass = document.getElementById('confirmPass').value.trim();
            const statusBox = document.getElementById('statusMessageBox');

            const expectedPass = getSavedPasswordForAccount(currentPortalMode, selectedAccountId);
            const masterAdminPass = getSavedPasswordForAccount('admin', 'ADMIN');

            // If Admin is changing an Office/Supervisor password, allow either the user's current password OR Admin's master password
            const isValidCurrentPass = (currentPortalMode === loggedPortalContext && loggedPortalContext !== 'admin')
                ? (currentPass === expectedPass)
                : (currentPass === expectedPass || currentPass === masterAdminPass || currentPass === "admin123");

            if (!isValidCurrentPass) {
                statusBox.className = 'status-msg-box error';
                statusBox.innerText = `❌ Current password does not match! (Active password for ${selectedAccountId} is "${expectedPass}")`;
                return;
            }

            if (newPass.length < 4) {
                statusBox.className = 'status-msg-box error';
                statusBox.innerText = `⚠️ New password must be at least 4 characters long!`;
                return;
            }

            if (newPass !== confirmPass) {
                statusBox.className = 'status-msg-box error';
                statusBox.innerText = `❌ New Password and Confirm New Password do not match!`;
                return;
            }

            // Save password for the target account
            saveNewPasswordForAccount(currentPortalMode, selectedAccountId, newPass);

            document.getElementById('currentPassHint').innerText = `Active Pass: ${newPass}`;
            document.getElementById('currentPass').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';

            statusBox.className = 'status-msg-box success';
            statusBox.innerHTML = `✅ <strong>Password Changed Successfully!</strong><br>Account: ${selectedAccountText}<br>New Password: <strong>${newPass}</strong>`;

            setTimeout(() => {
                alert(`✅ Password updated successfully for:\n${selectedAccountText}`);
                handleBackToDashboard();
            }, 300);
        }

        // =========================================================================================
        // 6. SMART BACK TO DASHBOARD NAVIGATION FOR ALL 3 PORTALS
        // =========================================================================================
        function handleBackToDashboard(event) {
            if (event) event.preventDefault();

            try {
                if (window.parent && window.parent !== window) {
                    if (loggedPortalContext === 'office' && typeof window.parent.loadOfficeWorkspaceHome === 'function') {
                        window.parent.loadOfficeWorkspaceHome();
                        return;
                    }
                    const parentHomeLink = window.parent.document.querySelector('.dashboard-home-link');
                    if (parentHomeLink && parentHomeLink.href) {
                        if (typeof window.parent.clearTreeActiveLinks === 'function') {
                            window.parent.clearTreeActiveLinks();
                        }
                        window.location.href = parentHomeLink.href;
                        return;
                    }
                }
            } catch (err) {}

            if (window.parent !== window && window.history.length > 1) {
                window.history.back();
                return;
            }

            if (loggedPortalContext === 'office') {
                window.location.href = `office/office_dashboard_home.html?userId=${encodeURIComponent(lockedActiveUserId || 'OFF-101')}`;
            } else if (loggedPortalContext === 'supervisor') {
                window.location.href = "supervisor/supervisor_dashboard_home.html";
            } else {
                window.location.href = "dashboard_home.html";
            }
        }

        window.onload = detectInitialPortalAndUser;
    </script>
</body>
</html>
